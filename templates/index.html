<!DOCTYPE html>
<html>
<head>
    <title>AI Sign Translator</title>

    <style>
        body {
            background: #0f172a;
            color: white;
            text-align: center;
            font-family: Arial;
        }

        h1 {
            margin-top: 20px;
            font-size: 32px;
        }

        img {
            margin-top: 20px;
            border: 5px solid #00ffcc;
            border-radius: 12px;
        }

        button {
            margin: 15px;
            padding: 12px 25px;
            font-size: 18px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
        }

        .speak { background: green; color: white; }
        .clear { background: red; color: white; }
    </style>
</head>

<body>

<h1>🤖 AI Sign Language Translator</h1>

<img src="{{ url_for('video') }}" width="800">

<br>

<button class="speak" onclick="speakText()">🔊 Speak</button>
<button class="clear" onclick="clearText()">🧹 Clear</button>

<script>
function clearText() {
    fetch('/clear');
}

function speakText() {
    fetch('/speak');
}
</script>

</body>
</html>
